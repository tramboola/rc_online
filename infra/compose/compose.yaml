name: rc-racing

x-node-service: &node-service
  restart: unless-stopped
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-runtime-env: &runtime-env
  NODE_ENV: development
  MOCK_MODE: "true"
  DATABASE_URL: postgresql://rc:rc_dev_only@postgres:5432/rc_racing
  REDIS_URL: redis://redis:6379
  IDENTITY_PROVIDER: mock
  PAYMENT_PROVIDER: mock
  DEVICE_PROVIDER: simulator
  TIMING_PROVIDER: simulator
  CAMERA_PROVIDER: loop
  PUBLIC_STREAM_PROVIDER: mediamtx
  NOTIFICATION_PROVIDER: mailpit
  APP_ORIGIN: http://localhost:3000
  API_ORIGIN: http://api:3001
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318

services:
  postgres:
    profiles: [core]
    image: postgres:16.4-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: rc
      POSTGRES_PASSWORD: rc_dev_only
      POSTGRES_DB: rc_racing
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rc -d rc_racing"]
      interval: 5s
      timeout: 3s
      retries: 20
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run/postgresql:rw,noexec,nosuid,size=16m
    networks: [state]

  redis:
    profiles: [core]
    image: redis:7.4.1-bookworm
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "60"
      - "1000"
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    networks: [state]

  migrate:
    profiles: [core]
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.node
      args:
        APP_FILTER: "@rc/database"
    environment:
      <<: *runtime-env
    command: ["pnpm", "--filter", "@rc/database", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [state]

  api:
    <<: *node-service
    profiles: [core]
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.node
      args:
        APP_FILTER: "@rc/api"
    environment:
      <<: *runtime-env
      PORT: "3001"
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 10s
      timeout: 4s
      retries: 12
    networks: [frontend, state, simulator, observability]

  worker:
    <<: *node-service
    profiles: [core]
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.node
      args:
        APP_FILTER: "@rc/worker"
    environment:
      <<: *runtime-env
      PORT: "8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health/ready').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 10s
      timeout: 4s
      retries: 12
    networks: [state, observability]

  web:
    <<: *node-service
    profiles: [core]
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.node
      args:
        APP_FILTER: "@rc/web"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_ORIGIN: http://localhost:3001
      NEXT_PUBLIC_EDGE_ORIGIN: http://localhost:3002
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 10s
      timeout: 4s
      retries: 12
    networks: [frontend]

  edge:
    <<: *node-service
    profiles: [sim]
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.node
      args:
        APP_FILTER: "@rc/edge"
    environment:
      <<: *runtime-env
      EDGE_PORT: "3002"
      EDGE_DATABASE_PATH: /var/lib/rc-edge/outbox.db
    volumes:
      - edge-data:/var/lib/rc-edge
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    networks: [frontend, simulator, observability]

  coturn:
    profiles: [sim]
    image: coturn/coturn:4.6.3
    restart: unless-stopped
    command:
      - --no-cli
      - --fingerprint
      - --lt-cred-mech
      - --realm=rc.local
      - --user=rc-local:local-only-change-me
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --no-tls
      - --no-dtls
      - --log-file=stdout
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    networks: [simulator]

  mediamtx:
    profiles: [sim]
    image: bluenviron/mediamtx:1.10.0
    restart: unless-stopped
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - camera-recordings:/recordings
    ports:
      - "127.0.0.1:8554:8554"
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:8889:8889"
      - "127.0.0.1:1935:1935"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [simulator]

  mailpit:
    profiles: [sim]
    image: axllent/mailpit:v1.21.8
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [simulator]

  prometheus:
    profiles: [obs]
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      [
        "--config.file=/etc/prometheus/prometheus.yml",
        "--storage.tsdb.path=/prometheus",
      ]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [observability]

  grafana:
    profiles: [obs]
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: local-only-change-me
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/default.yml:ro
    ports:
      - "127.0.0.1:3003:3000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [observability]

  loki:
    profiles: [obs]
    image: grafana/loki:3.2.0
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "127.0.0.1:3100:3100"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [observability]

  tempo:
    profiles: [obs]
    image: grafana/tempo:2.6.0
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./observability/tempo.yml:/etc/tempo.yml:ro
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [observability]

volumes:
  postgres-data:
  redis-data:
  edge-data:
  camera-recordings:
  prometheus-data:
  grafana-data:

networks:
  frontend:
  simulator:
  observability:
  state:
    internal: true
