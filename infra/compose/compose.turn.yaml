name: rcmania-turn

services:
  turn:
    image: coturn/coturn:4.16.0-r0-alpine
    restart: unless-stopped
    network_mode: host
    entrypoint: ["/bin/sh", "/opt/rcmania/entrypoint.sh"]
    environment:
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:?Set TURN_EXTERNAL_IP to the reserved public IPv4 address}
    secrets:
      - turn_shared_secret
    volumes:
      - ./coturn/turnserver.conf.template:/etc/coturn/turnserver.conf.template:ro
      - ./coturn/entrypoint.sh:/opt/rcmania/entrypoint.sh:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    read_only: true
    tmpfs:
      - /run/coturn:rw,noexec,nosuid,size=1m,mode=0700
      - /var/lib/coturn:rw,noexec,nosuid,size=8m
      - /tmp:rw,noexec,nosuid,size=8m
    healthcheck:
      test: ["CMD-SHELL", "turnutils_stunclient -p 3478 \"$$TURN_EXTERNAL_IP\" >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    cpus: "0.80"
    mem_limit: 384m
    pids_limit: 128
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    stop_grace_period: 15s

secrets:
  turn_shared_secret:
    file: ${TURN_SHARED_SECRET_PATH:?Set TURN_SHARED_SECRET_PATH to a root-readable secret file}
