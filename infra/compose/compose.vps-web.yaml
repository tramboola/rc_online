name: rcmania

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: rcmania
      POSTGRES_USER: rcmania
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the private env file}
    volumes:
      - rcmania-postgres-data:/var/lib/postgresql/data
    networks:
      - state
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    shm_size: 128mb
    mem_limit: 512m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  migrate:
    image: rcmania-migrate:${RC_IMAGE_TAG:?Set RC_IMAGE_TAG to the Git commit SHA}
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.migrate
    restart: "no"
    init: true
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the private env file}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - state
    mem_limit: 256m
    pids_limit: 128
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "2"

  web:
    image: rcmania-web:${RC_IMAGE_TAG:?Set RC_IMAGE_TAG to the Git commit SHA}
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.web
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/apps/web/.next/cache:rw,noexec,nosuid,size=128m
    environment:
      NODE_ENV: production
      MOCK_MODE: "true"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the private env file}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in the private env file}
      AUTH_URL: ${AUTH_URL:?Set AUTH_URL in the private env file}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:?Set GOOGLE_OAUTH_CLIENT_ID in the private env file}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:?Set GOOGLE_OAUTH_CLIENT_SECRET in the private env file}
      GATEWAY_SESSION_SECRET: ${GATEWAY_SESSION_SECRET:?Set GATEWAY_SESSION_SECRET in the private env file}
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-wss://rcmania.live/gateway/v1/socket}
      GATEWAY_ICE_SERVERS_JSON: ${GATEWAY_ICE_SERVERS_JSON:-[{"urls":"stun:turn.rcmania.live:3478"},{"urls":"turn:turn.rcmania.live:3478?transport=udp"},{"urls":"turn:turn.rcmania.live:3478?transport=tcp"},{"urls":"turns:turn.rcmania.live:443?transport=tcp"}]}
      TURN_SHARED_SECRET_FILE: /run/secrets/turn_shared_secret
      TURN_CREDENTIAL_TTL_SECONDS: ${TURN_CREDENTIAL_TTL_SECONDS:-600}
      WEBRTC_ICE_TRANSPORT_POLICY: ${WEBRTC_ICE_TRANSPORT_POLICY:-all}
    secrets:
      - turn_shared_secret
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - edge
      - state
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    cpus: "0.80"
    mem_limit: 768m
    pids_limit: 256
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    stop_grace_period: 20s

  gateway:
    image: rcmania-gateway:${RC_IMAGE_TAG:?Set RC_IMAGE_TAG to the Git commit SHA}
    build:
      context: ../..
      dockerfile: infra/compose/Dockerfile.gateway
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    volumes:
      - /opt/rcmania/shared/agent-releases:/agent-releases:ro
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3002"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the private env file}
      DEVICE_AUTH_PEPPER: ${DEVICE_AUTH_PEPPER:?Set DEVICE_AUTH_PEPPER in the private env file}
      GATEWAY_SESSION_SECRET: ${GATEWAY_SESSION_SECRET:?Set GATEWAY_SESSION_SECRET in the private env file}
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-wss://rcmania.live/gateway/v1/socket}
      GATEWAY_ICE_SERVERS_JSON: ${GATEWAY_ICE_SERVERS_JSON:-[{"urls":"stun:turn.rcmania.live:3478"},{"urls":"turn:turn.rcmania.live:3478?transport=udp"},{"urls":"turn:turn.rcmania.live:3478?transport=tcp"},{"urls":"turns:turn.rcmania.live:443?transport=tcp"}]}
      TURN_SHARED_SECRET_FILE: /run/secrets/turn_shared_secret
      TURN_CREDENTIAL_TTL_SECONDS: ${TURN_CREDENTIAL_TTL_SECONDS:-600}
    secrets:
      - turn_shared_secret
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - edge
      - state
    ports:
      - "127.0.0.1:3002:3002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health/ready').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    cpus: "0.30"
    mem_limit: 256m
    pids_limit: 128
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    stop_grace_period: 10s

networks:
  edge:
  state:
    internal: true

volumes:
  rcmania-postgres-data:

secrets:
  turn_shared_secret:
    file: ${TURN_SHARED_SECRET_PATH:?Set TURN_SHARED_SECRET_PATH to a root-readable secret file}
