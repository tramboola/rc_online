limit_conn_zone $server_name zone=viewer_connections:64k;
limit_req_zone $server_name zone=viewer_handshakes:64k rate=20r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    server_tokens off;

    client_max_body_size 10m;

    location /agent-releases/ {
        alias /opt/rcmania/shared/agent-releases/;
        autoindex off;
        default_type application/octet-stream;
        limit_except GET { deny all; }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /gateway/v1/viewers {
        access_log off;
        error_log /dev/null crit;
        limit_conn viewer_connections 500;
        limit_conn_status 503;
        limit_req zone=viewer_handshakes burst=100 nodelay;
        limit_req_status 503;

        proxy_pass http://127.0.0.1:3002/v1/viewers;
        proxy_http_version 1.1;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header User-Agent "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    location /gateway/ {
        proxy_pass http://127.0.0.1:3002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
