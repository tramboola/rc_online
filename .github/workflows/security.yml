name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "19 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3

  semgrep:
    runs-on: ubuntu-24.04
    container:
      image: semgrep/semgrep:1.129.0
    steps:
      - uses: actions/checkout@v7
      - run: semgrep scan --config p/owasp-top-ten --config p/secrets --error .

  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: anchore/sbom-action@v0.20.6
        with:
          path: .
          format: cyclonedx-json
          output-file: rc-racing-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: rc-racing-sbom
          path: rc-racing-sbom.cdx.json
