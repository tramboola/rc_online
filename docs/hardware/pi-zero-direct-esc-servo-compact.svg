<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700">
  <defs>
    <style>
      .bg { fill: #f7fafc; }
      .title { font: 700 30px Arial, sans-serif; fill: #101820; }
      .subtitle { font: 600 19px Arial, sans-serif; fill: #394956; }
      .label { font: 700 18px Arial, sans-serif; fill: #101820; }
      .small { font: 600 15px Arial, sans-serif; fill: #263640; }
      .tiny { font: 700 11px Arial, sans-serif; fill: #101820; }
      .white { font: 700 21px Arial, sans-serif; fill: #fff; }
      .board { fill: #176b45; stroke: #0c3d29; stroke-width: 5; }
      .header { fill: #162129; stroke: #071014; stroke-width: 4; }
      .pin { fill: #e8bd43; stroke: #5f4a00; stroke-width: 2; }
      .p12 { fill: #ffd400; stroke: #6c5400; stroke-width: 4; }
      .p14 { fill: #111; stroke: #000; stroke-width: 4; }
      .p35 { fill: #fff; stroke: #263640; stroke-width: 4; }
      .device { fill: #34424c; stroke: #101820; stroke-width: 5; }
      .connector { fill: #fff; stroke: #263640; stroke-width: 3; }
      .steer { fill: none; stroke: #ffd400; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
      .esc-outline { fill: none; stroke: #263640; stroke-width: 15; stroke-linecap: round; stroke-linejoin: round; }
      .esc-signal { fill: none; stroke: #fff; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
      .ground { fill: none; stroke: #111; stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; }
      .bec { fill: none; stroke: #e32636; stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; }
      .resistor { fill: #e6c188; stroke: #6d4a1e; stroke-width: 4; }
      .note { fill: #fff5f5; stroke: #cc1f2f; stroke-width: 4; }
      .note-text { font: 700 18px Arial, sans-serif; fill: #b01827; }
    </style>
  </defs>

  <rect class="bg" width="1400" height="700"/>
  <text x="700" y="42" text-anchor="middle" class="title">Raspberry Pi Zero 2 W → рулевая машинка + ESC</text>
  <text x="700" y="72" text-anchor="middle" class="subtitle">Минимальная тестовая проводка • общий GND обязателен</text>

  <!-- Pi board fragment -->
  <rect x="32" y="95" width="320" height="565" rx="24" class="board"/>
  <text x="55" y="140" class="white">Raspberry Pi</text>
  <text x="55" y="168" class="white">Zero 2 W</text>
  <text x="55" y="196" class="small" fill="#fff">вид сверху</text>
  <rect x="205" y="105" width="125" height="520" rx="12" class="header"/>
  <text x="234" y="116" text-anchor="middle" class="tiny" fill="#fff">НЕЧЁТ.</text>
  <text x="300" y="116" text-anchor="middle" class="tiny" fill="#fff">ЧЁТ.</text>

  <!-- Exact 2x20 physical header numbering -->
  <g>
    <circle cx="234" cy="125" r="9" class="pin"/><text x="234" y="129" text-anchor="middle" class="tiny">1</text>
    <circle cx="300" cy="125" r="9" class="pin"/><text x="300" y="129" text-anchor="middle" class="tiny">2</text>
    <circle cx="234" cy="150" r="9" class="pin"/><text x="234" y="154" text-anchor="middle" class="tiny">3</text>
    <circle cx="300" cy="150" r="9" class="pin"/><text x="300" y="154" text-anchor="middle" class="tiny">4</text>
    <circle cx="234" cy="175" r="9" class="pin"/><text x="234" y="179" text-anchor="middle" class="tiny">5</text>
    <circle cx="300" cy="175" r="9" class="pin"/><text x="300" y="179" text-anchor="middle" class="tiny">6</text>
    <circle cx="234" cy="200" r="9" class="pin"/><text x="234" y="204" text-anchor="middle" class="tiny">7</text>
    <circle cx="300" cy="200" r="9" class="pin"/><text x="300" y="204" text-anchor="middle" class="tiny">8</text>
    <circle cx="234" cy="225" r="9" class="pin"/><text x="234" y="229" text-anchor="middle" class="tiny">9</text>
    <circle cx="300" cy="225" r="9" class="pin"/><text x="300" y="229" text-anchor="middle" class="tiny">10</text>
    <circle cx="234" cy="250" r="9" class="pin"/><text x="234" y="254" text-anchor="middle" class="tiny">11</text>
    <circle cx="300" cy="250" r="14" class="p12"/><text x="300" y="255" text-anchor="middle" class="tiny">12</text>
    <circle cx="234" cy="275" r="9" class="pin"/><text x="234" y="279" text-anchor="middle" class="tiny">13</text>
    <circle cx="300" cy="275" r="14" class="p14"/><text x="300" y="280" text-anchor="middle" class="tiny" fill="#fff">14</text>
    <circle cx="234" cy="300" r="9" class="pin"/><text x="234" y="304" text-anchor="middle" class="tiny">15</text>
    <circle cx="300" cy="300" r="9" class="pin"/><text x="300" y="304" text-anchor="middle" class="tiny">16</text>
    <circle cx="234" cy="325" r="9" class="pin"/><text x="234" y="329" text-anchor="middle" class="tiny">17</text>
    <circle cx="300" cy="325" r="9" class="pin"/><text x="300" y="329" text-anchor="middle" class="tiny">18</text>
    <circle cx="234" cy="350" r="9" class="pin"/><text x="234" y="354" text-anchor="middle" class="tiny">19</text>
    <circle cx="300" cy="350" r="9" class="pin"/><text x="300" y="354" text-anchor="middle" class="tiny">20</text>
    <circle cx="234" cy="375" r="9" class="pin"/><text x="234" y="379" text-anchor="middle" class="tiny">21</text>
    <circle cx="300" cy="375" r="9" class="pin"/><text x="300" y="379" text-anchor="middle" class="tiny">22</text>
    <circle cx="234" cy="400" r="9" class="pin"/><text x="234" y="404" text-anchor="middle" class="tiny">23</text>
    <circle cx="300" cy="400" r="9" class="pin"/><text x="300" y="404" text-anchor="middle" class="tiny">24</text>
    <circle cx="234" cy="425" r="9" class="pin"/><text x="234" y="429" text-anchor="middle" class="tiny">25</text>
    <circle cx="300" cy="425" r="9" class="pin"/><text x="300" y="429" text-anchor="middle" class="tiny">26</text>
    <circle cx="234" cy="450" r="9" class="pin"/><text x="234" y="454" text-anchor="middle" class="tiny">27</text>
    <circle cx="300" cy="450" r="9" class="pin"/><text x="300" y="454" text-anchor="middle" class="tiny">28</text>
    <circle cx="234" cy="475" r="9" class="pin"/><text x="234" y="479" text-anchor="middle" class="tiny">29</text>
    <circle cx="300" cy="475" r="9" class="pin"/><text x="300" y="479" text-anchor="middle" class="tiny">30</text>
    <circle cx="234" cy="500" r="9" class="pin"/><text x="234" y="504" text-anchor="middle" class="tiny">31</text>
    <circle cx="300" cy="500" r="9" class="pin"/><text x="300" y="504" text-anchor="middle" class="tiny">32</text>
    <circle cx="234" cy="525" r="9" class="pin"/><text x="234" y="529" text-anchor="middle" class="tiny">33</text>
    <circle cx="300" cy="525" r="9" class="pin"/><text x="300" y="529" text-anchor="middle" class="tiny">34</text>
    <circle cx="234" cy="550" r="14" class="p35"/><text x="234" y="555" text-anchor="middle" class="tiny">35</text>
    <circle cx="300" cy="550" r="9" class="pin"/><text x="300" y="554" text-anchor="middle" class="tiny">36</text>
    <circle cx="234" cy="575" r="9" class="pin"/><text x="234" y="579" text-anchor="middle" class="tiny">37</text>
    <circle cx="300" cy="575" r="9" class="pin"/><text x="300" y="579" text-anchor="middle" class="tiny">38</text>
    <circle cx="234" cy="600" r="9" class="pin"/><text x="234" y="604" text-anchor="middle" class="tiny">39</text>
    <circle cx="300" cy="600" r="9" class="pin"/><text x="300" y="604" text-anchor="middle" class="tiny">40</text>
  </g>

  <!-- Pin labels -->
  <text x="360" y="230" class="label">GPIO18 / физ. pin 12 — РУЛЬ PWM</text>
  <text x="360" y="300" class="label">GND / физ. pin 14 — ОБЩАЯ ЗЕМЛЯ</text>
  <text x="360" y="530" class="label">GPIO19 / физ. pin 35 — ESC PWM</text>

  <!-- Steering signal and resistor -->
  <path d="M315 250 H600" class="steer"/>
  <rect x="600" y="233" width="82" height="34" rx="8" class="resistor"/>
  <path d="M617 233 v34 M637 233 v34 M657 233 v34" stroke="#9b2736" stroke-width="7"/>
  <text x="641" y="220" text-anchor="middle" class="label">1 кОм</text>
  <path d="M682 250 H780 V160 H1040" class="steer"/>

  <!-- ESC signal and resistor -->
  <path d="M219 550 H175 V585 H600 V550" class="esc-outline"/>
  <path d="M219 550 H175 V585 H600 V550" class="esc-signal"/>
  <rect x="600" y="533" width="82" height="34" rx="8" class="resistor"/>
  <path d="M617 533 v34 M637 533 v34 M657 533 v34" stroke="#9b2736" stroke-width="7"/>
  <text x="641" y="520" text-anchor="middle" class="label">1 кОм</text>
  <path d="M682 550 H820 V480 H1040" class="esc-outline"/>
  <path d="M682 550 H820 V480 H1040" class="esc-signal"/>

  <!-- Explicit continuous common ground -->
  <path d="M315 275 H900" class="ground"/>
  <path d="M900 240 V560" class="ground"/>
  <path d="M900 240 H1040" class="ground"/>
  <path d="M900 560 H1040" class="ground"/>
  <circle cx="900" cy="275" r="11" fill="#111"/>
  <text x="915" y="298" class="small">общий GND</text>

  <!-- BEC from ESC to servo only -->
  <path d="M1040 520 H960 V200 H1040" class="bec"/>
  <text x="970" y="375" text-anchor="middle" class="small" fill="#c51f31">красный: BEC ESC → +5–6 В серво</text>

  <!-- Servo -->
  <rect x="1110" y="105" width="250" height="190" rx="22" class="device"/>
  <text x="1235" y="195" text-anchor="middle" class="white">РУЛЬ</text>
  <text x="1235" y="225" text-anchor="middle" class="small" fill="#fff">сервопривод</text>
  <rect x="1025" y="125" width="85" height="150" rx="10" class="connector"/>
  <circle cx="1040" cy="160" r="8" fill="#ffd400" stroke="#111" stroke-width="3"/>
  <circle cx="1040" cy="200" r="8" fill="#e32636" stroke="#111" stroke-width="3"/>
  <circle cx="1040" cy="240" r="8" fill="#111"/>
  <text x="1012" y="165" text-anchor="end" class="small">SIGNAL</text>
  <text x="1012" y="205" text-anchor="end" class="small">+5–6 В</text>
  <text x="1012" y="245" text-anchor="end" class="small">GND</text>
  <path d="M1048 160 H1110 M1048 200 H1110 M1048 240 H1110" stroke="#111" stroke-width="7"/>

  <!-- ESC -->
  <rect x="1110" y="420" width="250" height="205" rx="22" class="device"/>
  <text x="1235" y="515" text-anchor="middle" class="white">ESC</text>
  <text x="1235" y="545" text-anchor="middle" class="small" fill="#fff">со встроенным BEC</text>
  <rect x="1025" y="445" width="85" height="145" rx="10" class="connector"/>
  <circle cx="1040" cy="480" r="8" fill="#fff" stroke="#111" stroke-width="3"/>
  <circle cx="1040" cy="520" r="8" fill="#e32636" stroke="#111" stroke-width="3"/>
  <circle cx="1040" cy="560" r="8" fill="#111"/>
  <text x="1012" y="485" text-anchor="end" class="small">SIGNAL</text>
  <text x="1012" y="525" text-anchor="end" class="small">+ BEC</text>
  <text x="1012" y="565" text-anchor="end" class="small">GND</text>

  <!-- Warning -->
  <rect x="365" y="610" width="650" height="65" rx="14" class="note"/>
  <text x="690" y="650" text-anchor="middle" class="note-text">Красный BEC не подключать к GPIO, 3.3V или 5V Raspberry Pi</text>

  <!-- Redraw pin 35 above its outgoing wire so the physical number stays readable -->
  <circle cx="234" cy="550" r="14" class="p35"/>
  <text x="234" y="555" text-anchor="middle" class="tiny">35</text>
</svg>
